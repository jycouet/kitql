allowBuilds:
 esbuild: true
 sharp: false

packages:
 - 'packages/*'
 - 'docs'

# Supply-chain cooldown: skip versions published less than a day ago (mitigates a
# compromised-release window). Closely-tracked publishers are excluded so they still
# update immediately.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
 - remult
 - '@sveltejs/*'

catalogs:
 tooling:
  '@typescript/native-preview': 7.0.0-dev.20260319.1
  'typescript': '6.0.2'
  'esbuild': '0.28.0'
  'ora': '10.0.0'

 vite:
  # Pin exact Vite so SvelteKit + Vitest share one install (avoids duplicate Rollup types in svelte-check).
  'vite': '8.4.0'

 testing:
  # unit
  'vitest': '5.1.1'
  '@vitest/ui': 5.1.1
  '@vitest/coverage-v8': '5.1.1'
  '@vitest/browser-playwright': '5.1.1'
  vitest-browser-svelte: 3.1.0
  # e2e
  '@playwright/test': '1.65.1'

 # Ranges, not pins: published by @kitql/eslint-config (except dev-only @typescript-eslint/types).
 linting:
  '@e18e/eslint-plugin': ^0.8.1
  '@eslint/compat': '^2.1.1'
  '@eslint/js': '^10.0.1'
  '@types/eslint': '^9.6.1'
  '@typescript-eslint/parser': '^8.73.0'
  '@typescript-eslint/types': '8.74.0'
  'eslint': '^10.15.0'
  'eslint-config-prettier': '^10.1.8'
  'eslint-plugin-pnpm': '^1.9.1'
  'eslint-plugin-svelte': '^3.24.1'
  'globals': '^17.14.0'
  'typescript-eslint': '^8.73.0'
  jsonc-eslint-parser: ^3.3.0
  yaml-eslint-parser: ^2.1.0

 linting-oxc:
  oxlint: ^1.94.0
  oxlint-tsgolint: ^7.0.2008
  eslint-plugin-oxlint: ^1.94.0
  oxfmt: ^0.80.0

 lib-author-helper:
  '@changesets/changelog-github': '1.0.1'
  '@changesets/cli': '3.0.3'
  'publint': '0.3.1'
  'tslib': '2.9.1'
  'rollup-plugin-visualizer': '7.1.1'

 # Ranges, not pins: published as-is, so apps can share one copy with their other deps.
 lib-dep-publish:
  'esm-env': '^1.2.2'
  '@types/vary': '1.1.3'
  'vary': '^1.1.2'
  'picomatch': '^4.0.7'
  'esrap': '^2.4.0'
  'oxc-parser': '^0.160.0'
  'oxc-walker': '^1.1.1'

 sveltekit:
  '@sveltejs/kit': '3.4.0'
  '@sveltejs/package': '3.0.3'
  '@sveltejs/vite-plugin-svelte': '7.3.1'
  '@sveltejs/adapter-auto': '9.0.0'
  '@sveltejs/adapter-node': '6.0.5'

 svelte:
  'svelte': '5.59.1'
  'svelte-check': '4.7.6'

 svelte-dep:
  '@sveltejs/kit': '^2.16.0 || ^3.0.0'
  'svelte': '^5.0.0'

 remult:
  'remult': '3.4.2'

 docs:
  '@astrojs/starlight': 0.43.1
  accessible-astro-components: 5.8.0
  astro: 7.4.13
  astro-icon: 1.2.0
  sharp: 0.35.5

# Run package.json scripts with pnpm's portable shell (`rm -rf` works on Windows too).
shellEmulator: true
