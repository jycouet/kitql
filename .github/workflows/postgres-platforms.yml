name: Publish @kitql/postgres platforms

# The `@kitql/postgres-<os>-<cpu>` packages are generated from a theseus-rs/postgresql-binaries
# release and versioned like PostgreSQL (e.g. 18.6.1), so they are published by hand, outside
# changesets. Run this before releasing a @kitql/postgres that points to a new version.
on:
 workflow_dispatch:
  inputs:
   version:
    description: 'theseus-rs/postgresql-binaries release (empty: PG_VERSION of packages/postgres/src/platforms.js)'
    required: false

jobs:
 publish:
  if: github.repository == 'jycouet/kitql'
  permissions:
   contents: read
   id-token: write # provenance
  runs-on: ubuntu-latest
  timeout-minutes: 15
  steps:
   - uses: actions/checkout@v6

   - uses: jycouet/jycouet/shared-config/setup@main
     name: setup env
     with:
      nodeVersion: 24
      pnpmVersion: 11.2.2

   - name: 🚧 Build helpers
     run: pnpm -F @kitql/helpers build

   - name: 📦 Generate & publish
     run: pnpm -F @kitql/postgres platforms --target all --publish ${{ inputs.version && format('--version {0}', inputs.version) || '' }}
     env:
      NPM_CONFIG_PROVENANCE: true
